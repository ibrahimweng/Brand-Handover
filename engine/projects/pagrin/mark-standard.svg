<!-- Pagrin, tier 2 of 4: the fan with its convergence taken out.

     Every number here is read off mark.svg. The rays of the master converge on
     a point the path returns to eleven times, at (7.6, 177.2), and the white
     wedges between them sit at 11.2, 24.3, 35.4, 44.4, 52.0, 60.4 and 77.5
     degrees from it, measured off the render at three radii and stable across
     all three. Nothing in this drawing is at a bearing the master does not use.

     All seven wedges, stopped 20 units short of the apex.

     The master cannot go below 335 px because the rays meet at a point, and at a
     point the ink between them is nothing at all: it measures 1.1 units thick.
     Taking the last 20 units out is the whole of this rung. Nothing is dropped
     and the floor comes down to 197 px. -->
